name: f1_app
description: "F1 Drivers Catalog"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^9.1.1
  go_router: ^14.8.1
  dio: ^5.11.1
  http: ^1.2.1
  url_launcher: ^6.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.12.0
  cached_network_image: ^4.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/

